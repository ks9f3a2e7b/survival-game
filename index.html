<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>生存战争</title>
  <style>
    :root {
      --bg1: #0b1220;
      --bg2: #1b2a39;
      --panel: rgba(13, 22, 34, 0.86);
      --line: rgba(255,255,255,0.08);
      --text: #edf6ff;
      --accent: #65d6ff;
      --danger: #ff5d5d;
      --good: #82f2a2;
      --warn: #ffd166;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      background: radial-gradient(circle at top, #13273d, var(--bg1) 54%, #070d14);
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    .game-shell {
      width: min(96vw, 980px);
      position: relative;
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 18px 54px rgba(0,0,0,0.45);
      background: rgba(7, 12, 18, 0.72);
    }

    .hud {
      position: absolute;
      inset: 0 0 auto 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 14px 18px;
      background: linear-gradient(to bottom, rgba(12,18,26,0.9), rgba(12,18,26,0.15));
      z-index: 5;
      pointer-events: none;
    }

    .stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 14px;
      letter-spacing: 0.5px;
    }

    .stat {
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(13, 22, 34, 0.7);
      backdrop-filter: blur(8px);
    }

    .stat strong {
      color: var(--accent);
    }

    .controls {
      position: absolute;
      right: 18px;
      top: 14px;
      z-index: 7;
      pointer-events: auto;
    }

    button {
      border: 1px solid rgba(255,255,255,0.12);
      background: linear-gradient(135deg, #122a3a, #173a57);
      color: var(--text);
      border-radius: 999px;
      padding: 9px 16px;
      font-size: 14px;
      cursor: pointer;
      transition: transform 0.08s ease, filter 0.2s ease;
      box-shadow: 0 10px 18px rgba(17, 78, 118, 0.25);
    }

    button:hover {
      filter: brightness(1.06);
    }

    button:active {
      transform: translateY(1px);
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      background: linear-gradient(180deg, #0d1824, #111d2b 40%, #0a1119);
      user-select: none;
    }

    .overlay {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(8, 14, 22, 0.34);
      backdrop-filter: blur(2px);
      z-index: 6;
      text-align: center;
      padding: 20px;
    }

    .overlay.hidden { display: none; }

    .panel {
      width: min(540px, 86%);
      background: rgba(10, 18, 28, 0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px;
      padding: 28px 22px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.38);
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(32px, 4vw, 48px);
      letter-spacing: 2px;
      color: #fcfeff;
    }

    .subtitle {
      margin: 0 0 18px;
      color: rgba(255,255,255,0.78);
      line-height: 1.7;
      font-size: 15px;
    }

    .legend {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 18px 0 22px;
      color: rgba(255,255,255,0.8);
      font-size: 13px;
    }

    .legend span {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 999px;
      padding: 6px 10px;
    }

    .status {
      margin-top: 12px;
      font-size: 15px;
      color: var(--warn);
      min-height: 24px;
    }
  </style>
</head>
<body>
  <div class="game-shell">
    <div class="hud">
      <div class="stats">
        <div class="stat">生命: <strong id="hpValue">100</strong></div>
        <div class="stat">分数: <strong id="scoreValue">0</strong></div>
        <div class="stat">时间: <strong id="timeValue">90</strong>s</div>
        <div class="stat">敌人: <strong id="enemyValue">0</strong></div>
        <div class="stat">补给: <strong id="supplyValue">0</strong></div>
      </div>
    </div>

    <div class="controls">
      <button id="toggleBtn" type="button">开始游戏</button>
    </div>

    <canvas id="gameCanvas" width="960" height="600"></canvas>

    <div id="overlay" class="overlay">
      <div class="panel">
        <h1>生存战争</h1>
        <p class="subtitle">
          你是最后的幸存者。控制角色移动、射击敌人、收集补给，撑过 90 秒生存时间。
        </p>

        <div class="legend">
          <span>WASD / 方向键 移动</span>
          <span>鼠标点击 / 空格 射击</span>
          <span>拾取补给恢复生命</span>
        </div>

        <button id="startBtn" type="button">开始战斗</button>
        <div id="status" class="status"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const overlay = document.getElementById('overlay');
    const toggleBtn = document.getElementById('toggleBtn');
    const startBtn = document.getElementById('startBtn');
    const statusEl = document.getElementById('status');

    const hpValue = document.getElementById('hpValue');
    const scoreValue = document.getElementById('scoreValue');
    const timeValue = document.getElementById('timeValue');
    const enemyValue = document.getElementById('enemyValue');
    const supplyValue = document.getElementById('supplyValue');

    const WORLD = { width: canvas.width, height: canvas.height, goalTime: 90 };

    const keys = {};
    let mouse = { x: canvas.width / 2, y: canvas.height / 2, down: false };

    let gameState = 'ready';
    let gameTime = 0;
    let lastTimestamp = 0;
    let score = 0;

    let player;
    let enemies = [];
    let bullets = [];
    let pickups = [];
    let particles = [];
    let spawnTimer = 0;
    let supplyTimer = 0;

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function distance(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function randomRange(min, max) {
      return min + Math.random() * (max - min);
    }

    function createPlayer() {
      return {
        x: WORLD.width / 2,
        y: WORLD.height / 2,
        radius: 16,
        speed: 3.5,
        hp: 100,
        maxHp: 100,
        fireCooldown: 0,
        damage: 22,
        color: '#7ee7ff'
      };
    }

    function createEnemy() {
      const edge = Math.floor(Math.random() * 4);
      let x = 0;
      let y = 0;
      if (edge === 0) { x = randomRange(0, WORLD.width); y = -30; }
      if (edge === 1) { x = WORLD.width + 30; y = randomRange(0, WORLD.height); }
      if (edge === 2) { x = randomRange(0, WORLD.width); y = WORLD.height + 30; }
      if (edge === 3) { x = -30; y = randomRange(0, WORLD.height); }

      return {
        x,
        y,
        radius: randomRange(12, 20),
        speed: randomRange(0.9, 1.9) + Math.min(1.5, gameTime / 80),
        hp: 30 + Math.random() * 18 + Math.min(25, gameTime / 2),
        maxHp: 30,
        color: '#ff6b6b',
        damage: 10 + Math.min(16, gameTime / 15)
      };
    }

    function spawnEnemyBurst() {
      const count = Math.min(6, 1 + Math.floor(gameTime / 18));
      for (let i = 0; i < count; i++) {
        enemies.push(createEnemy());
      }
    }

    function createPickup() {
      const types = ['med', 'ammo', 'boost'];
      const type = types[Math.floor(Math.random() * types.length)];
      return {
        x: randomRange(40, WORLD.width - 40),
        y: randomRange(40, WORLD.height - 40),
        radius: 10,
        type,
        pulse: Math.random() * Math.PI * 2
      };
    }

    function addParticles(x, y, color, count = 10) {
      for (let i = 0; i < count; i++) {
        particles.push({
          x, y,
          vx: randomRange(-1.4, 1.4),
          vy: randomRange(-1.4, 1.4),
          life: randomRange(24, 42),
          maxLife: 42,
          radius: randomRange(2, 5),
          color
        });
      }
    }

    function resetGame() {
      gameTime = 0;
      score = 0;
      enemies = [];
      bullets = [];
      pickups = [];
      particles = [];
      spawnTimer = 0;
      supplyTimer = 0;
      player = createPlayer();
      for (let i = 0; i < 5; i++) enemies.push(createEnemy());
      for (let i = 0; i < 3; i++) pickups.push(createPickup());
      updateHud();
    }

    function startGame() {
      resetGame();
      gameState = 'running';
      overlay.classList.add('hidden');
      statusEl.textContent = '战斗开始！';
      toggleBtn.textContent = '重新开始';
    }

    function endGame(win) {
      gameState = win ? 'won' : 'lost';
      overlay.classList.remove('hidden');
      overlay.querySelector('.panel').innerHTML = `
        <h1>${win ? '胜利' : '失败'}</h1>
        <p class="subtitle">
          ${win ? '你成功撑过了 90 秒，守住了这片区域！' : '你被敌人压制了，战争还在继续。'}
          <br>
          终局分数：<strong>${score}</strong>
        </p>
        <div class="legend">
          <span>WASD / 方向键 移动</span>
          <span>鼠标点击 / 空格 射击</span>
          <span>补给能恢复生命</span>
        </div>
        <button id="restartBtn" type="button">再来一局</button>
        <div class="status">${win ? '你赢了！' : '再试一次吧！'}</div>
      `;

      document.getElementById('restartBtn').addEventListener('click', () => {
        startGame();
      });
    }

    function updateHud() {
      hpValue.textContent = Math.max(0, Math.ceil(player.hp));
      scoreValue.textContent = Math.floor(score);
      timeValue.textContent = Math.max(0, Math.ceil(WORLD.goalTime - gameTime));
      enemyValue.textContent = enemies.length;
      supplyValue.textContent = pickups.length;
    }

    function shoot() {
      if (gameState !== 'running') return;
      if (player.fireCooldown > 0) return;
      const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
      bullets.push({
        x: player.x + Math.cos(angle) * (player.radius + 8),
        y: player.y + Math.sin(angle) * (player.radius + 8),
        vx: Math.cos(angle) * 8.2,
        vy: Math.sin(angle) * 8.2,
        radius: 4,
        life: 70,
        color: '#f7fbff'
      });
      player.fireCooldown = 0.18;
    }

    function handleMovement(dt) {
      let moveX = 0;
      let moveY = 0;
      if (keys['w'] || keys['arrowup']) moveY -= 1;
      if (keys['s'] || keys['arrowdown']) moveY += 1;
      if (keys['a'] || keys['arrowleft']) moveX -= 1;
      if (keys['d'] || keys['arrowright']) moveX += 1;

      if (moveX !== 0 || moveY !== 0) {
        const len = Math.hypot(moveX, moveY) || 1;
        player.x += (moveX / len) * player.speed * dt * 60;
        player.y += (moveY / len) * player.speed * dt * 60;
      }

      player.x = clamp(player.x, player.radius, WORLD.width - player.radius);
      player.y = clamp(player.y, player.radius + 42, WORLD.height - player.radius);
    }

    function update(dt) {
      if (gameState !== 'running') return;

      gameTime += dt;
      player.fireCooldown = Math.max(0, player.fireCooldown - dt);

      handleMovement(dt);

      if (mouse.down || keys[' ']) {
        shoot();
      }

      spawnTimer -= dt;
      if (spawnTimer <= 0) {
        spawnEnemyBurst();
        spawnTimer = Math.max(0.45, 1.4 - gameTime * 0.02);
      }

      supplyTimer -= dt;
      if (supplyTimer <= 0) {
        pickups.push(createPickup());
        supplyTimer = 8 + Math.random() * 8;
      }

      for (const bullet of bullets) {
        bullet.x += bullet.vx * dt * 60;
        bullet.y += bullet.vy * dt * 60;
        bullet.life -= dt * 60;
      }
      bullets = bullets.filter(b => b.life > 0 && b.x > -10 && b.x < WORLD.width + 10 && b.y > -10 && b.y < WORLD.height + 10);

      for (const enemy of enemies) {
        const dx = player.x - enemy.x;
        const dy = player.y - enemy.y;
        const dist = Math.hypot(dx, dy) || 1;

        if (dist > 0) {
          enemy.x += (dx / dist) * enemy.speed * dt * 60;
          enemy.y += (dy / dist) * enemy.speed * dt * 60;
        }

        if (dist < enemy.radius + player.radius + 2) {
          player.hp -= enemy.damage * dt * 2.2;
        }
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];
        for (let j = enemies.length - 1; j >= 0; j--) {
          const enemy = enemies[j];
          if (distance(bullet, enemy) < bullet.radius + enemy.radius) {
            enemy.hp -= player.damage;
            bullets.splice(i, 1);
            addParticles(bullet.x, bullet.y, '#dbeafe', 6);
            if (enemy.hp <= 0) {
              score += 12;
              addParticles(enemy.x, enemy.y, '#ff9f43', 18);
              const roll = Math.random();
              if (roll < 0.28) {
                pickups.push({
                  x: enemy.x,
                  y: enemy.y,
                  radius: 10,
                  type: 'med',
                  pulse: Math.random() * Math.PI * 2
                });
              }
              enemies.splice(j, 1);
            }
            break;
          }
        }
      }

      for (let i = pickups.length - 1; i >= 0; i--) {
        const pickup = pickups[i];
        pickup.pulse += dt * 5;
        if (distance(player, pickup) < player.radius + pickup.radius + 2) {
          if (pickup.type === 'med') {
            player.hp = Math.min(player.maxHp, player.hp + 30);
          } else if (pickup.type === 'ammo') {
            score += 10;
          } else {
            player.speed = Math.min(5.1, player.speed + 0.25);
            player.damage = Math.min(32, player.damage + 2);
          }
          addParticles(pickup.x, pickup.y, '#82f2a2', 12);
          pickups.splice(i, 1);
        }
      }

      if (player.hp <= 0) {
        endGame(false);
        return;
      }

      if (gameTime >= WORLD.goalTime) {
        endGame(true);
        return;
      }

      updateHud();

      for (const p of particles) {
        p.x += p.vx * dt * 60;
        p.y += p.vy * dt * 60;
        p.life -= dt * 60;
      }
      particles = particles.filter(p => p.life > 0);
    }

    function drawBackground() {
      ctx.clearRect(0, 0, WORLD.width, WORLD.height);
      const gradient = ctx.createLinearGradient(0, 0, 0, WORLD.height);
      gradient.addColorStop(0, '#0c1724');
      gradient.addColorStop(1, '#101a27');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, WORLD.width, WORLD.height);

      ctx.strokeStyle = 'rgba(125, 177, 255, 0.12)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= WORLD.width; x += 40) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, WORLD.height);
        ctx.stroke();
      }
      for (let y = 0; y <= WORLD.height; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(WORLD.width, y);
        ctx.stroke();
      }
    }

    function drawPlayer() {
      ctx.beginPath();
      ctx.fillStyle = player.color;
      ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
      ctx.fill();

      const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
      ctx.beginPath();
      ctx.strokeStyle = '#dff6ff';
      ctx.lineWidth = 3;
      ctx.moveTo(player.x, player.y);
      ctx.lineTo(player.x + Math.cos(angle) * 18, player.y + Math.sin(angle) * 18);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(player.x - 18, player.y - 28, 36, 6);
      ctx.fillStyle = '#82f2a2';
      ctx.fillRect(player.x - 18, player.y - 28, 36 * (player.hp / player.maxHp), 6);
    }

    function drawEnemies() {
      for (const enemy of enemies) {
        ctx.beginPath();
        ctx.fillStyle = enemy.color;
        ctx.arc(enemy.x, enemy.y, enemy.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(enemy.x - 16, enemy.y - enemy.radius - 12, 32, 5);
        ctx.fillStyle = '#ffb3b3';
        ctx.fillRect(enemy.x - 16, enemy.y - enemy.radius - 12, 32 * (enemy.hp / (enemy.maxHp || 30)), 5);
      }
    }

    function drawBullets() {
      for (const bullet of bullets) {
        ctx.beginPath();
        ctx.fillStyle = bullet.color;
        ctx.arc(bullet.x, bullet.y, bullet.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPickups() {
      for (const pickup of pickups) {
        const color = pickup.type === 'med' ? '#82f2a2' : pickup.type === 'ammo' ? '#ffd166' : '#65d6ff';
        const size = 8 + Math.sin(pickup.pulse) * 2;
        ctx.beginPath();
        ctx.fillStyle = color;
        ctx.arc(pickup.x, pickup.y, size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawParticles() {
      for (const p of particles) {
        const alpha = p.life / p.maxLife;
        ctx.beginPath();
        ctx.fillStyle = p.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function draw() {
      drawBackground();
      drawPickups();
      drawBullets();
      drawEnemies();
      drawPlayer();
      drawParticles();

      if (gameState === 'ready') {
        ctx.fillStyle = 'rgba(255,255,255,0.65)';
        ctx.font = 'bold 36px Microsoft YaHei';
        ctx.fillText('等待开始', 390, 300);
      }
    }

    function loop(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const dt = Math.min(0.032, (timestamp - lastTimestamp) / 1000);
      lastTimestamp = timestamp;

      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      keys[key] = true;
      if (key === ' ') {
        e.preventDefault();
        keys[' '] = true;
      }
      if (key === 'p') {
        if (gameState === 'running') {
          gameState = 'paused';
          statusEl.textContent = '已暂停';
          overlay.classList.remove('hidden');
          overlay.querySelector('.panel').innerHTML = `
            <h1>暂停</h1>
            <p class="subtitle">战斗已暂停，继续前进吧！</p>
            <button id="resumeBtn" type="button">继续</button>
          `;
          document.getElementById('resumeBtn').addEventListener('click', () => {
            gameState = 'running';
            overlay.classList.add('hidden');
            statusEl.textContent = '战斗继续';
          });
        }
      }
    });

    document.addEventListener('keyup', (e) => {
      const key = e.key.toLowerCase();
      keys[key] = false;
      if (key === ' ') keys[' '] = false;
    });

    canvas.addEventListener('mousemove', (event) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * canvas.width;
      mouse.y = ((event.clientY - rect.top) / rect.height) * canvas.height;
    });

    canvas.addEventListener('mousedown', () => {
      mouse.down = true;
      shoot();
    });

    canvas.addEventListener('mouseup', () => {
      mouse.down = false;
    });

    canvas.addEventListener('mouseleave', () => {
      mouse.down = false;
    });

    toggleBtn.addEventListener('click', () => {
      startGame();
    });

    startBtn.addEventListener('click', () => {
      startGame();
    });

    resetGame();
    draw();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
